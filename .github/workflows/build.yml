name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Zip ${{ matrix.browser }}
        run: pnpm wxt zip -b ${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        with:
          name: ytm-comments-${{ matrix.browser }}
          path: .output/*-${{ matrix.browser }}.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Upload Firefox sources
        if: matrix.browser == 'firefox'
        uses: actions/upload-artifact@v4
        with:
          name: ytm-comments-firefox-sources
          path: .output/*-sources.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
