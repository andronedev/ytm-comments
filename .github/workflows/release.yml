name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version --no-commit-hooks)
          NEW_VERSION=${NEW_VERSION#v}
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Type check
        run: pnpm compile

      - name: Build Chrome
        run: pnpm wxt zip -b chrome

      - name: Build Firefox
        run: pnpm wxt zip -b firefox

      - name: Build Edge
        run: pnpm wxt zip -b edge

      - name: Commit, tag and push
        run: |
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .output/ytm-comments-${{ steps.version.outputs.version }}-chrome.zip
            .output/ytm-comments-${{ steps.version.outputs.version }}-firefox.zip
            .output/ytm-comments-${{ steps.version.outputs.version }}-edge.zip
            .output/ytm-comments-${{ steps.version.outputs.version }}-sources.zip
